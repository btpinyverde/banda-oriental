<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Banda Oriental · API</title>
  {% load static %}
  <link rel="icon" type="image/png" href="{% static 'admin/logo-banda-oriental.png' %}">
  <style>
    :root { --crema: #fbf8f1; --tinta: #14110f; --suave: #4a4540; --violeta: #6c4ff0; --claro: #efedfc; }
    @media (prefers-color-scheme: dark) { :root { --crema: #14110f; --tinta: #fbf8f1; --suave: #c9c3bb; --claro: #26213a; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--crema); color: var(--tinta); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    main { max-width: 460px; text-align: center; }
    img { width: 180px; height: auto; margin-bottom: 8px; }
    h1 { margin: 12px 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; line-height: 1.6; color: var(--suave); }
    .acciones { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a { display: inline-block; padding: 14px 28px; border-radius: 999px; font-weight: 700; text-decoration: none; }
    .principal { background: var(--violeta); color: #fff; }
    .secundario { background: var(--claro); color: var(--violeta); }
    a:focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }
    small { display: block; margin-top: 28px; color: var(--suave); }
  </style>
</head>
<body>
  <main>
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="{% static 'admin/logo-banda-oriental-claro.png' %}">
      <img src="{% static 'admin/logo-banda-oriental.png' %}" alt="Banda Oriental">
    </picture>
    <h1>¿Qué pretende usted de mí?</h1>
    <p>Esta es la API de Banda Oriental: acá vive lo que el juego necesita para funcionar. Si venías a jugar, el juego está en otra dirección.</p>
    <div class="acciones">
      <a class="principal" href="{{ FRONTEND_URL }}">Ir a jugar</a>
      <a class="secundario" href="/api/health/">Estado del servicio</a>
    </div>
    <small>Banda Oriental · El juego de la música uruguaya</small>
  </main>
</body>
</html>
