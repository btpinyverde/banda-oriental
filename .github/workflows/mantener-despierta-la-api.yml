# Render (plan gratuito) duerme el servidor tras ~15 minutos sin visitas, y la primera persona que entra después espera
# hasta un minuto. Este chequeo consulta /api/health/ cada 10 minutos para que no llegue a dormirse.
#
# Para apagarlo: desactivar el flujo en la pestaña Actions de GitHub, o borrar este archivo.
# Ojo: el plan gratuito de Render da ~750 horas por mes en total entre todos los servicios gratuitos del espacio de
# trabajo; un servicio despierto las 24 horas usa ~744. Si hay otros servicios gratuitos en la misma cuenta, conviene
# mirar el consumo antes de dejarlo prendido.
name: Mantener despierta la API

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar el chequeo de salud de la API
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 20 \
            https://api.bandaoriental.xami.uy/api/health/
